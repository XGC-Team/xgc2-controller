schema: xgc2.product.v1
id: xgc2-controller
name: XGC2 Controller Aggregate
version: 1.3.14-9
kind: ros1-apt
summary: Aggregate ROS1 controller package that depends on the split XGC2 multirotor
  and UGV controller products.
ros:
  distro: noetic
  packages: []
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-controller
  packages:
  - ros-noetic-xgc2-controller
  depends:
  - ros-noetic-xgc2-multirotor-controller (>= 1.1.15-8)
  - ros-noetic-xgc2-ugv-controller (>= 1.1.1-6)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-controller

    '
  smoke_test: 'roslaunch --files px4_multirotor_controller uav_nmpc_controller.launch

    roslaunch --files unicycle_ugv_controller ugv_unicycle_nmpc_controller.launch

    '
ownership:
  paths:
  - /usr/share/doc/ros-noetic-xgc2-controller
