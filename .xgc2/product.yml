schema: xgc2.product.v1
id: xgc2-controller
name: XGC2 Controller
version: 1.3.1-1
kind: ros1-apt
summary: ROS1 controller packages for XGC2 robots, including PX4 multirotor and unicycle UGV NMPC control with reference trajectory generation.

ros:
  distro: noetic
  packages:
    - px4_multirotor_controller
    - multirotor_reference_trajectory
    - unicycle_ugv_controller
    - unicycle_reference_trajectory

apt:
  distribution: focal
  install:
    - ros-noetic-xgc2-controller
  packages:
    - ros-noetic-xgc2-controller
  depends:
    - libeigen3-dev
    - libxgc2-state-machine-dev (>= 0.1.2-1~focal)
    - libxgc2-math-dev (>= 0.5.2-1)
    - xgc2-acados (>= 0.1.0-3~focal)
    - ros-noetic-xgc2-ros1-utils
    - ros-noetic-xgc2-estimator-hover-thrust (>= 1.1.21-1)
    - ros-noetic-xgc2-estimator-rigid-state (>= 1.1.0-1)

usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-controller
  smoke_test: |
    roslaunch --files px4_multirotor_controller uav_nmpc_controller.launch
    roslaunch --files unicycle_ugv_controller ugv_unicycle_nmpc_controller.launch

ownership:
  paths:
    - /opt/ros/noetic/share/px4_multirotor_controller
    - /opt/ros/noetic/share/multirotor_reference_trajectory
    - /opt/ros/noetic/share/unicycle_ugv_controller
    - /opt/ros/noetic/share/unicycle_reference_trajectory
    - /opt/ros/noetic/include/px4_multirotor_controller
    - /opt/ros/noetic/include/multirotor_reference_trajectory
    - /opt/ros/noetic/include/unicycle_ugv_controller
    - /opt/ros/noetic/include/unicycle_reference_trajectory
    - /opt/ros/noetic/lib/px4_multirotor_controller
    - /opt/ros/noetic/lib/multirotor_reference_trajectory
    - /opt/ros/noetic/lib/unicycle_ugv_controller
    - /opt/ros/noetic/lib/unicycle_reference_trajectory
    - /opt/ros/noetic/lib/libpx4_multirotor_controller_uav_nmpc_runtime.so
    - /opt/ros/noetic/lib/libmultirotor_reference_trajectory_core.so
    - /opt/ros/noetic/lib/libunicycle_ugv_controller_nmpc_runtime.so
    - /opt/ros/noetic/lib/libunicycle_reference_trajectory_core.so
