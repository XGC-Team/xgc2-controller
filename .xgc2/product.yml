schema: xgc2.product.v1
id: xgc2-controller
name: XGC2 Controller Catalog
version: 1.4.0-2
kind: catalog
summary: Non-publishing catalog for the split XGC2 ROS1 controller products.
groups:
- controller
ros:
  distro: noetic
  packages: []
usage:
  notes: |
    This repository records the controller product set and its compatible
    versions. It does not build, install, or publish an aggregate Debian
    package. Consumers install the independent products they use:
    ros-noetic-xgc2-multirotor-controller and ros-noetic-xgc2-ugv-controller.
