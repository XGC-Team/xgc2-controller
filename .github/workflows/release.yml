name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source tests
        required: true
        default: false
      release_id:
        description: Parent orchestrator run id used for correlation and audit.
        required: false
        default: ""
        type: string
      release_lock_digest:
        description: SHA256 of the immutable release lock.
        required: false
        default: ""
        type: string
      trusted_ci_run_id:
        description: Exact successful push CI run whose trusted deb artifacts may be reused
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_version}" = "${{ inputs.expected_version }}"
          test "${actual_sha}" = "${{ inputs.expected_source_sha }}"

  package-compliance:
    name: Aggregate package compliance
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dpkg-dev \
            fakeroot \
            git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Download trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.trusted_ci_run_id }}
          name: xgc2-controller-debs
          path: .ci/trusted

      - name: Verify and stage trusted CI artifacts
        if: ${{ inputs.trusted_ci_run_id != '' }}
        run: |
          for arch in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir .ci/trusted \
            --deb-output-dir debs \
            --manifest-output-dir .ci/build-manifests \
            --product xgc2-controller \
            --distribution focal \
            --architecture "$arch" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "${{ inputs.trusted_ci_run_id }}"
          done

      - name: Check aggregate metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check HEAD
          .xgc2/scripts/check_version_bump.sh --ci
          .xgc2/scripts/check_package_compliance.sh

      - name: Build aggregate metapackage
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: .xgc2/scripts/package_debs.sh --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create fallback build manifest
        if: ${{ inputs.trusted_ci_run_id == '' }}
        run: |
          for arch in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-controller \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --architecture "$arch" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          done

      - name: Inspect aggregate metapackage
        run: |
          dpkg-deb -I debs/*.deb
          dpkg-deb -c debs/*.deb

      - name: Install-check aggregate against release APT
        env:
          XGC2_APT_DISTRIBUTION: focal
          XGC2_APT_COMPONENT: main
        run: |
          export DEBIAN_FRONTEND=noninteractive
          .xgc2/scripts/setup_xgc2_apt_source.sh
          apt-get install -y --no-install-recommends ./debs/*.deb
          .xgc2/scripts/check_installed_packages.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-controller-debs
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true

  publish-apt:
    name: Publish APT
    if: inputs.publish_apt
    needs: package-compliance
    runs-on: ubuntu-latest
    concurrency:
      group: xgc2-apt-focal
      cancel-in-progress: false
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-controller-debs
          path: release-input

      - name: Validate artifact and create release manifests
        run: |
          for arch in amd64 arm64; do
            python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir release-input \
            --deb-output-dir staged/debs \
            --manifest-output-dir staged/build-manifests \
            --product xgc2-controller \
            --distribution focal \
            --architecture "$arch" \
            --source-sha "${{ inputs.expected_source_sha }}"
          done
          python3 .xgc2/scripts/xgc2_artifact_manifest.py release \
            --deb-dir staged/debs \
            --build-manifest-dir staged/build-manifests \
            --publish-dir publish \
            --product xgc2-controller \
            --product-version "${{ inputs.expected_version }}" \
            --distribution focal \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --release-id "${{ inputs.release_id || github.run_id }}" \
            --release-lock-digest "${{ inputs.release_lock_digest }}" \
            --target-architecture amd64 \
            --target-architecture arm64

      - name: Publish to self-hosted APT repository
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir publish
