name: build-debs

on:
  push:
    branches:
      - noetic
  workflow_dispatch:
    inputs:
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: true
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  package-compliance:
    name: Aggregate package compliance
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            fakeroot \
            git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Check aggregate metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check HEAD
          .xgc2/scripts/check_version_bump.sh --ci
          .xgc2/scripts/check_package_compliance.sh

      - name: Build aggregate metapackage
        run: .xgc2/scripts/package_debs.sh --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Inspect aggregate metapackage
        run: |
          dpkg-deb -I debs/*.deb
          dpkg-deb -c debs/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-controller-debs
          path: debs/*.deb

  publish-apt:
    name: Publish APT
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_apt)
    needs: package-compliance
    runs-on: ubuntu-latest
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-controller-debs
          path: debs
          merge-multiple: true

      - name: Publish to self-hosted APT repository
        if: ${{ env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
