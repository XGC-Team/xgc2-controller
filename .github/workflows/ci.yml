name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run metadata checks
        run: |
          set -euo pipefail
          test -e "${GITHUB_WORKSPACE}/.git"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" diff --check HEAD
          python3 - <<'PY'
          import re
          from pathlib import Path
          product = Path(".xgc2/product.yml").read_text()
          assert re.search(r"^kind: catalog$", product, re.M), "the controller repository is a catalog"
          assert "apt:" not in product, "a catalog publishes no package"
          release_set = Path(".xgc2/release-set.yml").read_text()
          for name in ("multirotor_controller", "ugv_controller"):
              assert name + ":" in release_set, name
          PY
