name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    name: C++ quality
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install quality dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: Run C++ quality gate
        run: .xgc2/scripts/check_cpp_quality.sh

  package-compliance:
    name: Aggregate package compliance
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - name: Install packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev \
            fakeroot \
            git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Check aggregate metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

      - name: Build aggregate metapackage
        run: .xgc2/scripts/package_debs.sh --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Inspect aggregate metapackage
        run: |
          dpkg-deb -I debs/*.deb
          dpkg-deb -c debs/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-controller-debs
          path: debs/*.deb
